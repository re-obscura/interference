<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>interference · полигон</title>
<style>
  @font-face {
    font-family: 'DotGothic16';
    src: url('../fonts/DotGothic16.woff2') format('woff2');
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'DotGothic16', 'VT323', monospace; color: #f2f2f2; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
            opacity: 0; transition: opacity .6s; touch-action: none; }
  #canvas.on { opacity: 1; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #000; z-index: 2; transition: opacity .5s;
    padding: 0 20px; text-align: center;
  }
  #boot.off { opacity: 0; pointer-events: none; }
  .b-title { font-size: clamp(18px, 3.4vh, 30px); letter-spacing: .4em; }
  .b-tag { font-size: clamp(9px, 1.6vh, 12px); letter-spacing: .3em;
           color: rgba(255,255,255,.42); margin-top: -10px; }
  .b-status { font-size: clamp(10px, 1.8vh, 13px); letter-spacing: .18em;
              color: rgba(255,255,255,.75); min-height: 1.6em; font-variant-numeric: tabular-nums; }
  .b-bar { width: min(420px, 72vw); height: 8px; position: relative;
           border-left: 1px solid rgba(255,255,255,.3); border-right: 1px solid rgba(255,255,255,.3); }
  .b-bar::before { content: ''; position: absolute; left: 0; right: 0; top: 4px; height: 1px;
                   background: rgba(255,255,255,.13); }
  .b-bar i { position: absolute; left: 0; top: 3px; height: 2px; width: 0;
             background: rgba(255,255,255,.85); transition: width .2s; }
  .b-note { font-size: clamp(8px, 1.5vh, 11px); letter-spacing: .14em;
            color: rgba(255,255,255,.35); max-width: 520px; line-height: 1.7; }
  .b-err { color: #f2f2f2; font-size: 12px; letter-spacing: .1em; display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="boot">
  <div class="b-title">interference</div>
  <div class="b-tag">ПОЛИГОН · ЧБ-ВЕРСИЯ</div>
  <div class="b-status" id="status">подготовка погрузки…</div>
  <div class="b-bar"><i id="fill"></i></div>
  <div class="b-note">та же кровь, рагдоллы и горя, что в игре · ~150 МБ, собираются
    прямо в браузере · WebGL · ЛКМ — выстрел · курсор — прицел · 1/2 — ствол · R — ещё враг</div>
  <div class="b-err" id="err"></div>
</div>
<script src="index.js"></script>
<script>
(function () {
  'use strict';
  const CHUNKS = ['index.pck.aa', 'index.pck.ab'];
  const status = document.getElementById('status');
  const fill = document.getElementById('fill');
  const boot = document.getElementById('boot');
  const canvas = document.getElementById('canvas');
  const err = document.getElementById('err');

  function fail(msg) {
    status.textContent = 'СБОЙ ПОГРУЗКИ';
    err.style.display = 'block';
    err.textContent = msg;
    console.error(msg);
  }

  async function fetchChunk(url, onProgress, from, to) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + ' → ' + r.status);
    const total = +r.headers.get('Content-Length') || (to - from);
    const reader = r.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      parts.push(step.value);
      got += step.value.length;
      onProgress(got, total);
    }
    const out = new Uint8Array(got);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }

  (async function boot_() {
    try {
      status.textContent = 'носитель ………… подключён';
      const bufs = [];
      let bytesDone = 0;
      let chunksDone = 0;
      for (const c of CHUNKS) {
        const b = await fetchChunk(c, (got, total) => {
          const p = Math.min((chunksDone + got / Math.max(total, 1)) / CHUNKS.length, 1);
          fill.style.width = (p * 100).toFixed(1) + '%';
          status.textContent = 'погрузка пак ' + ((bytesDone + got) / 1048576 | 0) + ' из 145 МБ';
        });
        bufs.push(b);
        bytesDone += b.length;
        chunksDone += 1;
      }
      fill.style.width = '100%';
      status.textContent = 'самотест памяти …… ОК';

      await Engine.load('index');
      const engine = new Engine({
        executable: 'index',
        canvas: canvas,
        canvasResizePolicy: 2,
      });
      await engine.init();
      const size = bufs.reduce((s, b) => s + b.length, 0);
      const pack = new Uint8Array(size);
      let o = 0;
      for (const b of bufs) { pack.set(b, o); o += b.length; }
      await engine.copyToFS('index.pck', pack);
      status.textContent = 'запуск сцены';
      await engine.start({ args: ['--main-pack', 'index.pck'] });
      canvas.classList.add('on');
      boot.classList.add('off');
    } catch (e) {
      fail(String(e && e.message || e));
    }
  })();
})();
</script>
</body>
</html>
